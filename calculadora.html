
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora GRC</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  background: #10131b; font-family: Arial, sans-serif;
  color: white;
}
.calculadora {
  width: min(360px, 94vw); background: #191e29;
  padding: 22px; border-radius: 24px;
  box-shadow: 0 15px 50px #0008;
}
h2 { text-align: center; margin-top: 0; }
#visor {
  width: 100%; height: 100px; border: 0;
  background: #11151e; color: white;
  text-align: right; font-size: 40px;
  padding: 15px; border-radius: 12px;
  margin-bottom: 16px;
}
.botoes {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
button {
  border: 0; border-radius: 12px; height: 58px;
  background: #2a3140; color: white;
  font-size: 21px; cursor: pointer;
}
button:hover { filter: brightness(1.2); }
.operador { background: #e99a21; }
.especial { background: #424b5c; }
.zero { grid-column: span 2; }
</style>
</head>
<body>
<div class="calculadora">
  <h2>GRC Calculator</h2>
  <input id="visor" value="0" readonly aria-label="Visor">
  <div class="botoes">
    <button class="especial" onclick="limpar()">AC</button>
    <button class="especial" onclick="sinal()">±</button>
    <button class="especial" onclick="porcentagem()">%</button>
    <button class="operador" onclick="operar('/')">÷</button>

    <button onclick="digito('7')">7</button>
    <button onclick="digito('8')">8</button>
    <button onclick="digito('9')">9</button>
    <button class="operador" onclick="operar('*')">×</button>

    <button onclick="digito('4')">4</button>
    <button onclick="digito('5')">5</button>
    <button onclick="digito('6')">6</button>
    <button class="operador" onclick="operar('-')">−</button>

    <button onclick="digito('1')">1</button>
    <button onclick="digito('2')">2</button>
    <button onclick="digito('3')">3</button>
    <button class="operador" onclick="operar('+')">+</button>

    <button class="zero" onclick="digito('0')">0</button>
    <button onclick="decimal()">,</button>
    <button class="operador" onclick="calcular()">=</button>
  </div>
</div>

<script>
const visor = document.getElementById('visor');
let atual = '0';
let anterior = null;
let operador = null;
let iniciarNovo = false;

function atualizar() {
  visor.value = atual.replace('.', ',');
}

function digito(n) {
  if (atual === 'Erro' || iniciarNovo) {
    atual = n;
    iniciarNovo = false;
  } else if (atual === '0') {
    atual = n;
  } else if (atual.replace('-', '').length < 15) {
    atual += n;
  }
  atualizar();
}

function decimal() {
  if (atual === 'Erro' || iniciarNovo) {
    atual = '0.';
    iniciarNovo = false;
  } else if (!atual.includes('.')) {
    atual += '.';
  }
  atualizar();
}

function limpar() {
  atual = '0';
  anterior = null;
  operador = null;
  iniciarNovo = false;
  atualizar();
}

function sinal() {
  if (atual !== '0' && atual !== 'Erro') {
    atual = String(-Number(atual));
  }
  atualizar();
}

function porcentagem() {
  if (atual !== 'Erro') {
    atual = String(Number(atual) / 100);
    iniciarNovo = true;
  }
  atualizar();
}

function operar(op) {
  if (atual === 'Erro') return;
  if (operador && !iniciarNovo) calcular();
  anterior = Number(atual);
  operador = op;
  iniciarNovo = true;
}

function calcular() {
  if (operador === null || anterior === null || atual === 'Erro') return;
  const b = Number(atual);
  let r;
  switch (operador) {
    case '+': r = anterior + b; break;
    case '-': r = anterior - b; break;
    case '*': r = anterior * b; break;
    case '/':
      if (b === 0) {
        atual = 'Erro';
        anterior = null;
        operador = null;
        iniciarNovo = true;
        atualizar();
        return;
      }
      r = anterior / b;
      break;
  }
  atual = String(Number(r.toPrecision(12)));
  anterior = null;
  operador = null;
  iniciarNovo = true;
  atualizar();
}
</script>
</body>
</html>
